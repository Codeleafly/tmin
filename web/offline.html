<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route offline — tmin</title>
<meta name="description" content="This tmin route has no live tunnel connected.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2334d399'/%3E%3Cpath d='M9 12h14M16 12v9' stroke='%23022c22' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { brand: { 300: "#6ee7b7", 400: "#34d399", 500: "#10b981", 600: "#059669" } },
    fontFamily: { mono: ["ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"] },
  } },
};
</script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 antialiased">

<div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
  <div class="absolute -top-40 left-1/2 h-96 w-[52rem] -translate-x-1/2 rounded-full bg-brand-500/10 blur-3xl"></div>
</div>

<main class="relative mx-auto flex min-h-screen max-w-md flex-col items-center justify-center px-4 py-16">
  <a href="/" class="mb-8 flex items-center gap-2.5 font-semibold text-white">
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-brand-400 to-cyan-400 text-slate-950">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 8h14M12 8v11"/></svg>
    </span>
    <span class="text-lg tracking-tight">tmin</span>
  </a>

  <div class="card w-full p-8 text-center">
    <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-full bg-amber-400/15 text-amber-300">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10"/><circle cx="12" cy="18" r="1.5"/></svg>
    </div>
    <h1 class="text-2xl font-bold text-white">Route offline</h1>
    <p class="mt-3 text-sm leading-relaxed text-slate-400">
      <span class="code">{{routePath}}</span> has no live tunnel connected.
    </p>
    <p class="mt-3 text-sm leading-relaxed text-slate-500">
      Ask the owner to run <span class="code">tmin</span> again, or check the dashboard for connection history.
    </p>
    <div class="mt-7 flex justify-center gap-3">
      <a href="/docs" class="btn-ghost btn-sm">Docs</a>
      <a href="/" class="btn-primary btn-sm">tmin home</a>
    </div>
  </div>

  <p class="mt-6 text-xs text-slate-600">Permanent URLs stay owned — an offline route never serves another account's app.</p>
</main>
</body>
</html>
